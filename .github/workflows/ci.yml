name: Safe-C CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 gcc-13-plugin-dev g++-13 ninja-build
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-13 -DCMAKE_C_COMPILER=gcc-13

      - name: Build Project (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build --config Release

      - name: Run Test Suite (Linux)
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure

      - name: Test Native GCC Plugin Execution (Linux)
        if: runner.os == 'Linux'
        run: |
          PLUGIN_PATH="$(pwd)/build/lib/safe_c.so"
          echo "=== Testing compile_fail with native Linux plugin at ${PLUGIN_PATH} ==="
          ! gcc-13 -fplugin="${PLUGIN_PATH}" -c tests/compile_fail/double_free.c -o /dev/null
          ! gcc-13 -fplugin="${PLUGIN_PATH}" -c tests/compile_fail/altered_pointer_free.c -o /dev/null
          ! gcc-13 -fplugin="${PLUGIN_PATH}" -c tests/compile_fail/memory_leak.c -o /dev/null
          echo "=== Testing compile_pass with native Linux plugin ==="
          gcc-13 -fplugin="${PLUGIN_PATH}" -c tests/compile_pass/valid_pointers.c -o /dev/null
          gcc-13 -fplugin="${PLUGIN_PATH}" -c tests/compile_pass/valid_arithmetic.c -o /dev/null
          g++-13 -fplugin="${PLUGIN_PATH}" -c tests/compile_pass/valid_cpp_raii.cpp -o /dev/null
          echo "=== Native Linux GCC Plugin Verification Passed ==="

      - name: Set up MinGW (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build Project (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build --config Release

      - name: Run Test Suite (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

      - name: Verify Safe-C Windows Addon & Native Suite
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          echo "=== Verifying Safe-C Windows Addon & Native Suite ==="
          ls -la build/bin/safe_c.dll
          ./build/bin/safe_c_tests.exe
          echo "Safe-C Windows verification passed"
